<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deluxe Payments SDK Tester</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
    }

    .button-row button {
      margin-left: 8px;
    }

    /* MAIN LAYOUT FULL HEIGHT */
    .main-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 70px);
    }

    /* LEFT SIDE (SDK) */
    .left-panel {
      flex: 1.2;
      padding: 16px;
      overflow: hidden;
    }

    #embeddedpayments {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* RIGHT SIDE (CONFIG FULL HEIGHT) */
    .right-panel {
      flex: 1;
      max-width: 420px;
      border-left: 1px solid #eee;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .config-scroll {
      overflow-y: auto;
      flex: 1;
      padding-right: 8px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    pre {
      padding: 10px;
      font-size: 12px;
      overflow: auto;
    }

    /* DYNAMIC PANELS */
    .dynamic-panel {
      display: none;
      margin-top: 20px;
    }

    .dynamic-panel.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div>
        <h1>Deluxe Embedded Payments Tester</h1>
      </div>

      <div class="button-row">
        <button id="render-wallets-btn">Render Wallets</button>
        <button id="render-embedded-btn">Render Embedded Payments</button>
        <button id="merchant-status-btn">Get Merchant Status</button>
        <button id="clear-btn">Clear</button>
      </div>
    </header>

    <div class="main-layout">

      <!-- LEFT: SDK -->
      <div class="left-panel">
        <div id="embeddedpayments"></div>
      </div>

      <!-- RIGHT: CONFIG (FULL HEIGHT) -->
      <div class="right-panel">

        <div class="config-scroll">

          <h3>Merchant Configuration</h3>

          <label>Access Token</label>
          <input id="accessToken"/>

          <label>Secret Key</label>
          <input id="secretKey"/>

          <label>Amount</label>
          <input id="amount" value="1.00"/>

          <label>Apple Pay Style</label>
          <select id="applePayStyle">
            <option value="plain">plain</option>
            <option value="black">black</option>
            <option value="white">white</option>
          </select>

          <label>Google Pay Style</label>
          <select id="googlePayStyle">
            <option value="plain">plain</option>
            <option value="black">black</option>
            <option value="white">white</option>
          </select>

          <h3 style="margin-top:20px;">Customer</h3>

          <label>First Name</label>
          <input id="firstName"/>

          <label>Last Name</label>
          <input id="lastName"/>

          <label>Email</label>
          <input id="email"/>

          <label>Address</label>
          <input id="billingAddress"/>

          <label>City</label>
          <input id="billingCity"/>

          <label>State</label>
          <input id="billingState"/>

          <label>Zip</label>
          <input id="billingZipCode"/>

          <label>Country Code</label>
          <input id="billingCountryCode" value="USA"/>

          <h3 style="margin-top:20px;">Wallet Options</h3>

          <div class="checkbox-row">
            <input type="checkbox" id="hideApple"/>
            <label for="hideApple">Hide Apple Pay</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="hideGoogle"/>
            <label for="hideGoogle">Hide Google Pay</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="hidePaze"/>
            <label for="hidePaze">Hide Paze</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="hideChariot"/>
            <label for="hideChariot">Hide Chariot</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="savePaymentMethod"/>
            <label for="savePaymentMethod">Save Payment Method</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="generateToken"/>
            <label for="generateToken">Generate Token</label>
          </div>

          <!-- 🔥 DYNAMIC SECTIONS (ONLY SHOW ON BUTTON CLICK) -->

          <div id="wallets-panel" class="dynamic-panel">
            <h3>Wallets Output</h3>
            <div id="wallets-container"></div>
          </div>

          <div id="merchant-panel" class="dynamic-panel">
            <h3>Merchant Status</h3>
            <pre id="merchant-status"></pre>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="https://payments2.deluxe.com/embedded/javascripts/deluxe.js"></script>
  <script type="module" src="app.js"></script>

  <script>

    document.getElementById("render-wallets-btn").addEventListener("click", () => {
      document.getElementById("wallets-panel").classList.add("active");
      document.getElementById("merchant-panel").classList.remove("active");
    });

    document.getElementById("merchant-status-btn").addEventListener("click", () => {
      document.getElementById("merchant-panel").classList.add("active");
      document.getElementById("wallets-panel").classList.remove("active");
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      document.getElementById("wallets-panel").classList.remove("active");
      document.getElementById("merchant-panel").classList.remove("active");
    });
  </script>

</body>
</html>
