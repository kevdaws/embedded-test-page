<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deluxe Payments SDK Tester</title>
  <link rel="stylesheet" href="styles.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .page {
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .button-row button {
      margin-left: 8px;
    }

    /* CLEAN 2-COLUMN LAYOUT */
    .main-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .left-panel {
      flex: 1.1;
      min-width: 380px;
    }

    .right-panel {
      flex: 1;
      max-width: 420px;
    }

    .section {
      margin-bottom: 20px;
    }

    /* EMBEDDED CONTAINER */
    #embeddedpayments {
      width: 100%;
      min-height: 380px;
      max-height: 420px;
      overflow: hidden;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    pre {
      padding: 10px;
      overflow: auto;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div>
        <h1>Deluxe Embedded Payments Tester</h1>
        <p class="subtitle">Vanilla JS SDK Playground</p>
      </div>

      <div class="button-row">
        <button id="render-wallets-btn">Render Wallets</button>
        <button id="render-embedded-btn">Render Embedded Payments</button>
        <button id="merchant-status-btn">Get Merchant Status</button>
        <button id="clear-btn">Clear</button>
      </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">

      <!-- LEFT -->
      <div class="left-panel">

        <div class="section">
          <h2>Embedded Payments</h2>
          <div id="embeddedpayments"></div>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="right-panel">

        <div class="section">
          <h2>Merchant Configuration</h2>

          <label>Access Token</label>
          <input id="accessToken"/>

          <label>Secret Key</label>
          <input id="secretKey"/>

          <label>Amount</label>
          <input id="amount" value="1.00"/>

          <label>Apple Pay Style</label>
          <select id="applePayStyle">
            <option value="plain">plain</option>
            <option value="black">black</option>
            <option value="white">white</option>
          </select>

          <label>Google Pay Style</label>
          <select id="googlePayStyle">
            <option value="plain">plain</option>
            <option value="black">black</option>
            <option value="white">white</option>
          </select>
        </div>

        <div class="section">
          <h2>Customer</h2>

          <label>First Name</label>
          <input id="firstName"/>

          <label>Last Name</label>
          <input id="lastName"/>

          <label>Email</label>
          <input id="email"/>

          <label>Address</label>
          <input id="billingAddress"/>

          <label>City</label>
          <input id="billingCity"/>

          <label>State</label>
          <input id="billingState"/>

          <label>Zip</label>
          <input id="billingZipCode"/>

          <label>Country Code</label>
          <input id="billingCountryCode" value="USA"/>
        </div>

        <div class="section">
          <h2>Wallet Options</h2>

          <div class="checkbox-row">
            <input type="checkbox" id="hideApple"/>
            <label for="hideApple">Hide Apple Pay</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="hideGoogle"/>
            <label for="hideGoogle">Hide Google Pay</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="hidePaze"/>
            <label for="hidePaze">Hide Paze</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="hideChariot"/>
            <label for="hideChariot">Hide Chariot</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="savePaymentMethod"/>
            <label for="savePaymentMethod">Save Payment Method</label>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="generateToken"/>
            <label for="generateToken">Generate Token</label>
          </div>

          <div class="section">
            <h3>Payload Preview</h3>
            <pre id="payload-preview"></pre>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="https://payments2.deluxe.com/embedded/javascripts/deluxe.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
