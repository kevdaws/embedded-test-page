<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deluxe Payments SDK Tester</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7fb;
      color: #111;
    }

    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: white;
    }

    .button-row button {
      margin-left: 8px;
      padding: 6px 10px;
    }

    /* MAIN LAYOUT */
    .main-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 64px);
      gap: 16px;
      padding: 16px;
    }

    /* LEFT: SDK */
    .left-panel {
      flex: 1.2;
      background: white;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    #embeddedpayments {
      flex: 1;
      min-height: 0;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      max-width: 520px;
      background: white;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    /* 🔥 GRID CONFIG LAYOUT */
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .config-section {
      display: flex;
      flex-direction: column;
    }

    h3 {
      margin: 6px 0 8px;
      font-size: 14px;
    }

    label {
      font-size: 12px;
      margin-top: 6px;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 6px;
      font-size: 12px;
      margin-top: 3px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-top: 4px;
    }

    /* FULL WIDTH SECTIONS */
    .full-width {
      grid-column: span 2;
    }

    pre {
      font-size: 11px;
      background: #f4f4f4;
      padding: 8px;
      border-radius: 6px;
      overflow: auto;
      max-height: 140px;
    }

    /* DYNAMIC PANELS */
    .dynamic-panel {
      display: none;
    }

    .dynamic-panel.active {
      display: block;
    }

    #wallets-container,
    #merchant-status {
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <div class="header">
      <div>
        <h2 style="margin:0;">Deluxe Embedded Payments Tester</h2>
      </div>

      <div class="button-row">
        <button id="render-wallets-btn">Wallets</button>
        <button id="render-embedded-btn">Render</button>
        <button id="merchant-status-btn">Merchant</button>
        <button id="clear-btn">Clear</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main-layout">

      <!-- LEFT -->
      <div class="left-panel">
        <div id="embeddedpayments"></div>
      </div>

      <!-- RIGHT -->
      <div class="right-panel">

        <div class="config-grid">

          <!-- Merchant -->
          <div class="config-section">
            <h3>Merchant</h3>

            <label>Access Token</label>
            <input id="accessToken"/>

            <label>Secret Key</label>
            <input id="secretKey"/>

            <label>Amount</label>
            <input id="amount" value="1.00"/>

            <label>Apple Pay</label>
            <select id="applePayStyle">
              <option value="plain">plain</option>
              <option value="black">black</option>
              <option value="white">white</option>
            </select>

            <label>Google Pay</label>
            <select id="googlePayStyle">
              <option value="plain">plain</option>
              <option value="black">black</option>
              <option value="white">white</option>
            </select>
          </div>

          <!-- Customer -->
          <div class="config-section">
            <h3>Customer</h3>

            <label>First Name</label>
            <input id="firstName"/>

            <label>Last Name</label>
            <input id="lastName"/>

            <label>Email</label>
            <input id="email"/>

            <label>Address</label>
            <input id="billingAddress"/>

            <label>City</label>
            <input id="billingCity"/>

            <label>State</label>
            <input id="billingState"/>

            <label>Zip</label>
            <input id="billingZipCode"/>

            <label>Country</label>
            <input id="billingCountryCode" value="USA"/>
          </div>

          <!-- Wallet Options -->
          <div class="config-section full-width">
            <h3>Wallet Options</h3>

            <div class="checkbox-row">
              <input type="checkbox" id="hideApple"/>
              <label>Apple Pay</label>
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="hideGoogle"/>
              <label>Google Pay</label>
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="hidePaze"/>
              <label>Paze</label>
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="hideChariot"/>
              <label>Chariot</label>
            </div>
          </div>

          <!-- OUTPUTS -->
          <div id="wallets-panel" class="config-section full-width dynamic-panel">
            <h3>Wallet Output</h3>
            <div id="wallets-container"></div>
          </div>

          <div id="merchant-panel" class="config-section full-width dynamic-panel">
            <h3>Merchant Status</h3>
            <pre id="merchant-status"></pre>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="https://payments2.deluxe.com/embedded/javascripts/deluxe.js"></script>
  <script type="module" src="app.js"></script>

  <script>
    document.getElementById("render-wallets-btn").onclick = () => {
      document.getElementById("wallets-panel").classList.add("active");
      document.getElementById("merchant-panel").classList.remove("active");
    };

    document.getElementById("merchant-status-btn").onclick = () => {
      document.getElementById("merchant-panel").classList.add("active");
      document.getElementById("wallets-panel").classList.remove("active");
    };

    document.getElementById("clear-btn").onclick = () => {
      document.getElementById("wallets-panel").classList.remove("active");
      document.getElementById("merchant-panel").classList.remove("active");
    };
  </script>

</body>
</html>
